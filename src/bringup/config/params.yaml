/mv_camera:
  ros__parameters:
    # analog_gain: 60
    camera_info_url: package://bringup/config/camera_info.yaml
    camera_name: mv_camera
    frame_id: "camera_optical_frame"
    exposure_time: 4000
    flip_image: false
    gamma: 100
    rgb_gain:
      b: 100
      g: 120
      r: 155

/armor_detector:
  ros__parameters:
    # ── 四板靶标检测参数（改动会直接影响四板命中率，勿随意调）──
    armor:
      min_small_center_distance: 0.8
      max_small_center_distance: 3.2
      min_large_center_distance: 3.2
      max_large_center_distance: 5.0
      max_angle: 35.0
    debug: true

    detect_color: 0
    # 前哨站模式：三块不同高度装甲板绕同一竖直轴旋转，检测结果标记为 outpost
    outpost_mode: false
    binary_thres: 140

    # ── 前哨站检测参数（独立一套，与上面的四板参数互不影响）──
    # 前哨站灯条比四板靶标窄、板间隔 120°、板面下倾 15°，
    # 用四板那套参数会一个都配不上。默认值已在代码里给出，这里写出来便于调整。
    outpost:
      binary_thres: 60
      light:
        min_ratio: 0.05
        max_ratio: 1.0
        max_angle: 40.0
      armor:
        min_light_ratio: 0.70
        min_small_center_distance: 0.2
        max_small_center_distance: 2.0
        min_large_center_distance: 3.2
        max_large_center_distance: 5.0
        max_angle: 75.0

    classifier_threshold: 0.6
    ignore_classes: ["negative"]

    is_record: false
    save_video_path: armor.avi
    save_video_fps: 100
    save_video_width: 1280
    save_video_height: 1024

    subscribe_compressed: false

    light:
      max_angle: 40.0
      max_ratio: 0.8
      min_ratio: 0.05

    # armor:
    #   max_angle: 35.0
    #   max_center_ratio: 1.6
    #   min_center_ratio: 0.4
    #   min_light_ratio: 0.7
    #   max_large_center_distance: 5.0
    #   min_large_center_distance: 3.2
    #   max_small_center_distance: 3.2
    #   min_small_center_distance: 0.8

/armor_tracker:
  ros__parameters:
    target_frame: odom

    # 前哨站模式：使用 OutpostTracker（三块不同高度板的 11D EKF）。
    # 漏掉这个开关会让前哨站错误地使用四板的 4 板模型跟踪 3 块板。
    outpost_mode: false
    # 前哨站转速先验 [rad/s]，与 sim.yaml 的 outpost_angular_speed 保持一致
    outpost_v_yaw: 1.0

    # 最大装甲板距离，超过这个距离直接滤掉
    max_armor_distance: 10.0

    tracker:
      # 11D 刚开始跑时不要太小。
      # 旧的 0.15 对 11D 初期收敛太严格，容易频繁 Reset / Armor jump
      max_match_distance: 0.5

      # 装甲板 yaw 匹配阈值，单位 rad
      # 1.0 rad ≈ 57.3 deg
      max_match_yaw_diff: 1.0

      # 连续检测多少帧后进入 TRACKING
      # 新模型初期建议小一点，先让它稳定进入 tracking
      tracking_thres: 1

      # 临时丢失时间，单位 s
      lost_time_thres: 0.8

    ekf:
      # 平移过程噪声：xc/yc/za 的加速度噪声
      # 越大：响应越快，但中心更抖
      # 越小：更平滑，但对机动/小陀螺响应慢
      sigma2_q_xyz: 30.0

      # yaw 过程噪声：yaw/v_yaw 的角加速度噪声
      # 小陀螺需要相对大一些
      sigma2_q_yaw: 10.0

/trt_armor_detector:
  ros__parameters:
    subscribe_compressed: false
    active: true
    debug: true
    model_path: 20230415.trt
    # 0 for blue, 1 for red
    detect_color: 1
    prob_threshold: 0.25
    nms_threshold: 0.45

/lc_serial_driver:
  ros__parameters:
    device_name: /dev/ttyACM0
    baud_rate: 115200
    flow_control: none
    parity: none
    stop_bits: "1"

/gimbal_controller:
  ros__parameters:
    # MPC 会追"装甲板"轨迹；前哨站板会转到背面，云台就被一路带跑。
    # 关闭后改用 calcAimReferenceAtTime 的"朝圆心"逻辑（见该函数里
    # 没有板落在 max_move_yaw 窗口内时的分支）。
    mpc:
      enable: true
    # 前哨站模式：三块装甲板高度各不相同
    outpost_mode: false
    use_sim_interface: true

    is_pitch_gain: false
    is_track: true
#    shoot_delay: 0.05
#    shoot_delay_spin_: 0.20
#    gimbal_delay: 0.01
    shoot_delay: 0.0
    shoot_delay_spin_: 0.0
    gimbal_delay: 0.0

    max_move_yaw: 20.0
    # 前哨站云台固定朝圆心、不追板，需要放宽才能开火。
    fire_angle_threshold: 0.5
    timestamp_offset: 0.005
    # shoot_speed: 14.4
    shoot_speed: 26.0

    x_gain: 0.0
    y_gain: 0.0
    z_gain: 0.0
    pitch_gain_factor: 0.02

    sentray_mode: false
    pitch_scan_range: 0.0
    pitch_scan_f: 0.0
    yaw_scan_speed: 0.0
    
    # 龙格库塔法求解落点的迭代次数
    R_K_iter: 50
    # 使用迭代法求解pitch补偿的最大迭代次数
    max_iter: 10
    # 停止迭代的最小误差(单位m)
    stop_error: 0.001

/video_pub:
  ros__parameters:
    fps: 100
    # video_path: red_1_5m.avi
    # video_path: armor.avi
    video_path: blue3.avi
