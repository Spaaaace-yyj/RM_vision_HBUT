name: GitHub Feishu Notify

on:
  push:
    branches:
      - '**'

  pull_request:
    types:
      - opened
      - reopened
      - closed

  issues:
    types:
      - opened
      - reopened
      - closed

  # 可以在 GitHub Actions 页面手动点击 Run workflow 测试
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    name: Notify Feishu
    runs-on: ubuntu-latest
    timeout-minutes: 2

    env:
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}

    steps:
      - name: Build and send Feishu card
        shell: bash
        run: |
          set -euo pipefail

          EVENT_NAME="${GITHUB_EVENT_NAME}"
          EVENT_PATH="${GITHUB_EVENT_PATH}"

          REPOSITORY="${GITHUB_REPOSITORY}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          ACTOR="${GITHUB_ACTOR}"

          if [ -z "${FEISHU_WEBHOOK:-}" ]; then
            echo "::error::Repository secret FEISHU_WEBHOOK is not configured."
            exit 1
          fi

          HEADER_TITLE=""
          HEADER_COLOR="grey"
          BODY=""
          BUTTON_TEXT="View on GitHub"
          BUTTON_URL="${REPO_URL}"

          # ============================================================
          # 手动测试
          # ============================================================

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then

            HEADER_TITLE="GitHub · Notification test"
            HEADER_COLOR="grey"

            BODY=$(printf \
              '**%s**\n\nFeishu integration is working.\nTriggered by **%s**.' \
              "${REPO_NAME}" \
              "${ACTOR}"
            )

            BUTTON_TEXT="Open repository"
            BUTTON_URL="${REPO_URL}"

          # ============================================================
          # Push
          # ============================================================

          elif [ "${EVENT_NAME}" = "push" ]; then

            BRANCH=$(jq -r \
              '.ref | sub("^refs/heads/"; "")' \
              "${EVENT_PATH}"
            )

            PUSHER=$(jq -r \
              '.pusher.name // .sender.login // "unknown"' \
              "${EVENT_PATH}"
            )

            CREATED=$(jq -r \
              '.created // false' \
              "${EVENT_PATH}"
            )

            DELETED=$(jq -r \
              '.deleted // false' \
              "${EVENT_PATH}"
            )

            COMMIT_COUNT=$(jq \
              '(.commits // []) | length' \
              "${EVENT_PATH}"
            )

            COMPARE_URL=$(jq -r \
              '.compare // empty' \
              "${EVENT_PATH}"
            )

            # ----------------------------------------------------------
            # Branch deleted
            # ----------------------------------------------------------

            if [ "${DELETED}" = "true" ]; then

              HEADER_TITLE="GitHub · Branch deleted"
              HEADER_COLOR="red"

              BODY=$(printf \
                '**%s**\n\n`%s`\n\n%s deleted this branch.' \
                "${REPO_NAME}" \
                "${BRANCH}" \
                "${PUSHER}"
              )

              BUTTON_TEXT="View branches"
              BUTTON_URL="${REPO_URL}/branches"

            # ----------------------------------------------------------
            # Branch created
            # ----------------------------------------------------------

            elif [ "${CREATED}" = "true" ]; then

              HEADER_TITLE="GitHub · Branch created"
              HEADER_COLOR="green"

              BODY=$(printf \
                '**%s**\n\n`%s`\n\n%s created this branch.' \
                "${REPO_NAME}" \
                "${BRANCH}" \
                "${PUSHER}"
              )

              BUTTON_TEXT="View branch"
              BUTTON_URL="${REPO_URL}/tree/${BRANCH}"

            # ----------------------------------------------------------
            # Normal push
            # ----------------------------------------------------------

            else

              HEADER_TITLE="GitHub · Push"
              HEADER_COLOR="grey"

              COMMITS=$(jq -r \
                '(.commits // [])[:5][]
                | "`\(.id[0:7])`  \(.message | split("\n")[0])"' \
                "${EVENT_PATH}"
              )

              if [ -z "${COMMITS}" ]; then
                COMMITS="_No commit details available._"
              fi

              if [ "${COMMIT_COUNT}" -gt 5 ]; then

                REMAINING=$((COMMIT_COUNT - 5))

                COMMITS=$(printf \
                  '%s\n\n_+ %s more commits_' \
                  "${COMMITS}" \
                  "${REMAINING}"
                )

              fi

              if [ "${COMMIT_COUNT}" -eq 1 ]; then
                COMMIT_WORD="commit"
              else
                COMMIT_WORD="commits"
              fi

              BODY=$(printf \
                '**%s**\n\n`%s`\n%s pushed **%s %s**\n\n%s' \
                "${REPO_NAME}" \
                "${BRANCH}" \
                "${PUSHER}" \
                "${COMMIT_COUNT}" \
                "${COMMIT_WORD}" \
                "${COMMITS}"
              )

              BUTTON_TEXT="View changes"

              if [ -n "${COMPARE_URL}" ]; then
                BUTTON_URL="${COMPARE_URL}"
              else
                BUTTON_URL="${REPO_URL}/commits/${BRANCH}"
              fi

            fi

          # ============================================================
          # Pull Request
          # ============================================================

          elif [ "${EVENT_NAME}" = "pull_request" ]; then

            ACTION=$(jq -r \
              '.action' \
              "${EVENT_PATH}"
            )

            NUMBER=$(jq -r \
              '.pull_request.number' \
              "${EVENT_PATH}"
            )

            TITLE=$(jq -r \
              '.pull_request.title' \
              "${EVENT_PATH}"
            )

            AUTHOR=$(jq -r \
              '.pull_request.user.login' \
              "${EVENT_PATH}"
            )

            HEAD_BRANCH=$(jq -r \
              '.pull_request.head.ref' \
              "${EVENT_PATH}"
            )

            BASE_BRANCH=$(jq -r \
              '.pull_request.base.ref' \
              "${EVENT_PATH}"
            )

            URL=$(jq -r \
              '.pull_request.html_url' \
              "${EVENT_PATH}"
            )

            MERGED=$(jq -r \
              '.pull_request.merged // false' \
              "${EVENT_PATH}"
            )

            ADDITIONS=$(jq -r \
              '.pull_request.additions // 0' \
              "${EVENT_PATH}"
            )

            DELETIONS=$(jq -r \
              '.pull_request.deletions // 0' \
              "${EVENT_PATH}"
            )

            CHANGED_FILES=$(jq -r \
              '.pull_request.changed_files // 0' \
              "${EVENT_PATH}"
            )

            # ----------------------------------------------------------
            # Opened
            # ----------------------------------------------------------

            if [ "${ACTION}" = "opened" ]; then

              HEADER_TITLE="GitHub · Pull request #${NUMBER}"
              HEADER_COLOR="green"

              ACTION_TEXT="opened by **${AUTHOR}**"

            # ----------------------------------------------------------
            # Reopened
            # ----------------------------------------------------------

            elif [ "${ACTION}" = "reopened" ]; then

              HEADER_TITLE="GitHub · Pull request #${NUMBER} · Reopened"
              HEADER_COLOR="green"

              ACTION_TEXT="reopened by **${ACTOR}**"

            # ----------------------------------------------------------
            # Merged
            # ----------------------------------------------------------

            elif [ "${ACTION}" = "closed" ] && [ "${MERGED}" = "true" ]; then

              HEADER_TITLE="GitHub · Pull request #${NUMBER} · Merged"
              HEADER_COLOR="purple"

              MERGED_BY=$(jq -r \
                '.pull_request.merged_by.login // .sender.login // "unknown"' \
                "${EVENT_PATH}"
              )

              ACTION_TEXT="merged by **${MERGED_BY}**"

            # ----------------------------------------------------------
            # Closed
            # ----------------------------------------------------------

            else

              HEADER_TITLE="GitHub · Pull request #${NUMBER} · Closed"
              HEADER_COLOR="red"

              ACTION_TEXT="closed by **${ACTOR}**"

            fi

            BODY=$(printf \
              '**%s**\n\n`%s` → `%s`\n%s\n\n+%s  −%s  ·  %s files' \
              "${TITLE}" \
              "${HEAD_BRANCH}" \
              "${BASE_BRANCH}" \
              "${ACTION_TEXT}" \
              "${ADDITIONS}" \
              "${DELETIONS}" \
              "${CHANGED_FILES}"
            )

            BUTTON_TEXT="View pull request"
            BUTTON_URL="${URL}"

          # ============================================================
          # Issue
          # ============================================================

          elif [ "${EVENT_NAME}" = "issues" ]; then

            ACTION=$(jq -r \
              '.action' \
              "${EVENT_PATH}"
            )

            NUMBER=$(jq -r \
              '.issue.number' \
              "${EVENT_PATH}"
            )

            TITLE=$(jq -r \
              '.issue.title' \
              "${EVENT_PATH}"
            )

            AUTHOR=$(jq -r \
              '.issue.user.login' \
              "${EVENT_PATH}"
            )

            URL=$(jq -r \
              '.issue.html_url' \
              "${EVENT_PATH}"
            )

            STATE_REASON=$(jq -r \
              '.issue.state_reason // ""' \
              "${EVENT_PATH}"
            )

            LABELS=$(jq -r \
              '[.issue.labels[]?.name]
              | map("`" + . + "`")
              | join("  ")' \
              "${EVENT_PATH}"
            )

            # ----------------------------------------------------------
            # Opened
            # ----------------------------------------------------------

            if [ "${ACTION}" = "opened" ]; then

              HEADER_TITLE="GitHub · Issue #${NUMBER}"
              HEADER_COLOR="green"

              ACTION_TEXT="opened by **${AUTHOR}**"

            # ----------------------------------------------------------
            # Reopened
            # ----------------------------------------------------------

            elif [ "${ACTION}" = "reopened" ]; then

              HEADER_TITLE="GitHub · Issue #${NUMBER} · Reopened"
              HEADER_COLOR="green"

              ACTION_TEXT="reopened by **${ACTOR}**"

            # ----------------------------------------------------------
            # Closed
            # ----------------------------------------------------------

            else

              if [ "${STATE_REASON}" = "not_planned" ]; then

                HEADER_TITLE="GitHub · Issue #${NUMBER} · Not planned"
                HEADER_COLOR="grey"

              else

                HEADER_TITLE="GitHub · Issue #${NUMBER} · Closed"
                HEADER_COLOR="purple"

              fi

              ACTION_TEXT="closed by **${ACTOR}**"

            fi

            if [ -n "${LABELS}" ]; then

              BODY=$(printf \
                '**%s**\n\n%s\n\n%s' \
                "${TITLE}" \
                "${ACTION_TEXT}" \
                "${LABELS}"
              )

            else

              BODY=$(printf \
                '**%s**\n\n%s' \
                "${TITLE}" \
                "${ACTION_TEXT}"
              )

            fi

            BUTTON_TEXT="View issue"
            BUTTON_URL="${URL}"

          else

            echo "Unsupported event: ${EVENT_NAME}"
            exit 0

          fi

          # ============================================================
          # 构造飞书卡片
          # ============================================================

          PAYLOAD=$(jq -n \
            --arg header_title "${HEADER_TITLE}" \
            --arg header_color "${HEADER_COLOR}" \
            --arg body "${BODY}" \
            --arg button_text "${BUTTON_TEXT}" \
            --arg button_url "${BUTTON_URL}" \
            '{
              msg_type: "interactive",

              card: {
                config: {
                  wide_screen_mode: true
                },

                header: {
                  template: $header_color,

                  title: {
                    tag: "plain_text",
                    content: $header_title
                  }
                },

                elements: [
                  {
                    tag: "div",

                    text: {
                      tag: "lark_md",
                      content: $body
                    }
                  },

                  {
                    tag: "hr"
                  },

                  {
                    tag: "action",

                    actions: [
                      {
                        tag: "button",

                        text: {
                          tag: "plain_text",
                          content: $button_text
                        },

                        type: "default",
                        url: $button_url
                      }
                    ]
                  }
                ]
              }
            }'
          )

          # ============================================================
          # 发送
          # ============================================================

          RESPONSE=$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --header "Content-Type: application/json; charset=utf-8" \
            --data "${PAYLOAD}" \
            "${FEISHU_WEBHOOK}"
          )

          echo "Feishu response:"
          echo "${RESPONSE}" | jq '.' || echo "${RESPONSE}"

          # ============================================================
          # 检查飞书返回值
          # ============================================================

          RESULT_CODE=$(echo "${RESPONSE}" | jq -r '
            if has("StatusCode") then
              .StatusCode
            elif has("code") then
              .code
            else
              -1
            end
          ')

          if [ "${RESULT_CODE}" != "0" ]; then
            echo "::error::Feishu returned error code ${RESULT_CODE}."
            exit 1
          fi

          echo "Feishu notification sent successfully."